# Render.com blueprint — free, no credit card, WebSocket-capable.
# Deploy: push this folder to a GitHub repo, then on render.com → "New +" → "Blueprint" → pick the repo.
services:
  - type: web
    name: rank-up
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
